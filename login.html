<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mi Cuenta - Saberes App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="logo-area">
                <button class="icon-btn" onclick="regresarNavegacion()" style="margin-right: 10px; width: 40px; height: 40px; font-size: 1.1rem; border-color: transparent; background: rgba(255,255,255,0.1);">
                    <i class="fa-solid fa-arrow-left"></i>
                </button>
                <img src="logo.png" alt="Logo" onerror="this.src='https://via.placeholder.com/75/C58B45/FFFFFF?text=S'">
                <div class="logo-texto" onclick="window.location.href='index.html'" style="cursor: pointer;">
                    <span class="logo-nombre">Saberes Ancestrales</span>
                    <span class="logo-slogan">de la Vainilla</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" onclick="toggleTheme()" id="theme-btn"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>
        
        <main class="app-content">
            <div id="auth-guest">
                <div id="auth-initial-view">
                    <div class="auth-card-brown">
                        <div class="auth-icon-circle"><i class="fa-solid fa-user-plus"></i></div>
                        <h3>¿Eres nuevo?</h3>
                        <p>Crea una cuenta para comenzar a realizar tus pedidos.</p>
                        <button class="btn-auth-cream" onclick="mostrarForm('register')">Crear una cuenta</button>
                    </div>

                    <div class="auth-card-white">
                        <div class="auth-icon-circle-outline"><i class="fa-solid fa-arrow-right-to-bracket"></i></div>
                        <h3>¿Ya tienes una cuenta?</h3>
                        <p>Inicia sesión y continúa con tus pedidos.</p>
                        <button class="btn-auth-green" onclick="mostrarForm('login')">Iniciar sesión</button>
                    </div>
                </div>

                <div id="form-login" class="auth-form-container hidden">
                    <div class="auth-form-header">
                        <button class="btn-back" onclick="volverAlInicioAuth()"><i class="fa-solid fa-arrow-left"></i></button>
                        <h3>Iniciar Sesión</h3>
                        <div class="spacer"></div>
                    </div>
                    
                    <form onsubmit="event.preventDefault(); loginCliente();">
                        <div class="input-group"><label>Teléfono</label><input type="tel" id="log-tel" required placeholder="Ej. 7841234567"></div>
                        <div class="input-group"><label>Contraseña</label><input type="password" id="log-pass" required></div>
                        <button type="submit" class="btn btn-primary full-width mt-10">Entrar</button>
                    </form>
                </div>

                <div id="form-register" class="auth-form-container hidden">
                    <div class="auth-form-header">
                        <button class="btn-back" onclick="volverAlInicioAuth()"><i class="fa-solid fa-arrow-left"></i></button>
                        <h3>Crear Cuenta</h3>
                        <div class="spacer"></div>
                    </div>

                    <form onsubmit="event.preventDefault(); registerCliente();">
                        <div class="input-group"><label>Nombre Completo</label><input type="text" id="reg-nombre" required></div>
                        <div class="input-group"><label>Teléfono</label><input type="tel" id="reg-tel" required></div>
                        <div class="input-group"><label>Contraseña</label><input type="password" id="reg-pass" required></div>
                        <div class="input-group"><label>Calle y Colonia</label><input type="text" id="reg-calle" required></div>
                        <div class="row">
                            <!-- El número exterior SÍ es obligatorio -->
                            <div class="input-group"><label>Número Exterior</label><input type="text" id="reg-num" required></div>
                            <!-- El interior ES OPCIONAL -->
                            <div class="input-group"><label>Interior / Depto (Opc.)</label><input type="text" id="reg-int"></div>
                        </div>
                        <div class="input-group"><label>Referencias (Para el repartidor)</label><textarea id="reg-ref" rows="2" placeholder="Ej. Edificio blanco, portón negro..."></textarea></div>
                        <button type="submit" class="btn btn-primary full-width mt-10">Registrarme</button>
                    </form>
                </div>
            </div>

            <div id="auth-user" class="auth-form-container hidden" style="text-align:center;">
                <h3>Hola, <span id="user-name-display"></span></h3>
                <p>¿Qué deseas hacer hoy?</p>
                <button class="btn btn-primary full-width mt-10" onclick="window.location.href='menu.html'">Pedir Comida</button>
                <button class="btn btn-secondary full-width mt-10" onclick="cerrarSesionCliente()">Cerrar Sesión</button>
            </div>
            
        </main>

        <nav class="bottom-nav">
            <a href="index.html" class="nav-item"><span class="icon"><i class="fa-solid fa-house"></i></span><span class="label">Inicio</span></a>
            <a href="menu.html" class="nav-item"><span class="icon"><i class="fa-solid fa-utensils"></i></span><span class="label">Menú</span></a>
            <a href="conocenos.html" class="nav-item"><span class="icon"><i class="fa-solid fa-leaf"></i></span><span class="label">Conócenos</span></a>
            <a href="login.html" class="nav-item active"><span class="icon"><i class="fa-solid fa-user"></i></span><span class="label">Mi Cuenta</span></a>
        </nav>
    </div>
    <script src="app.js"></script>
</body>
</html>
